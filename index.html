<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426"><title>Cosmo · Infinity Watch Companion</title><meta name="description" content="The shared scene-aware watch companion for Infinity TV channels."><link rel="stylesheet" href="cosmo.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:30px;color:#f7fbff;background:radial-gradient(circle at 70% 15%,#164b7a,#071426 48%,#030813);font-family:Inter,system-ui,sans-serif}.intro{width:min(760px,100%);margin:8vh auto}.intro small{color:#72ccff;font-weight:900;letter-spacing:.2em}.intro h1{margin:.2em 0;font:700 clamp(3rem,10vw,7rem)/.9 Georgia,serif}.intro p{max-width:650px;color:#b8cbe0;font-size:1.1rem}.intro button{min-height:50px;padding:0 20px;color:#071426;background:#ffd66c;border:0;border-radius:999px;font-weight:900}</style></head><body><main class="intro"><small>INFINITY CHANNEL INTELLIGENCE</small><h1>Cosmo</h1><p>A shared companion that reads the channel’s timestamped scene index, understands the moment being watched, and keeps each viewer’s conversation and cards distinct.</p><button id="open" type="button">Open Cosmo demonstration</button></main><aside id="cosmo"></aside><script src="cosmo.js"></script><script>
let seconds=4;
const sample={moments:[{id:"demo-intro",start:0,end:42,transcript:"A presenter introduces a new broadcast system.",setting:"A television control room",actions:["The presenter points toward the active channel wall."],themes:["broadcasting","connection"],entities:[{name:"presenter",type:"person-in-program",description:"The person guiding the scene."}],objects:[{name:"channel wall",description:"A display showing many connected channels."}],connections:[{from:"channel wall",fromType:"object",relationship:"organizes",to:"live television network",toType:"system"}]}]};
const session=Cosmo.mount({root:document.querySelector("#cosmo"),user:{id:"demo-viewer"},program:()=>({id:"cosmo-demo",title:"Shared Channel Demonstration",channel:"Cosmo"}),playback:()=>({seconds:seconds++,playing:true}),index:()=>sample,proactiveEveryMs:60000});
document.querySelector("#open").onclick=()=>document.querySelector("#cosmo").hidden=false;
</script></body></html>
